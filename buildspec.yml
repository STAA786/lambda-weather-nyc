version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.14
    commands:
      - echo "Installing dependencies..."
      - pip install --upgrade pip

  pre_build:
    commands:
      - echo "Pre-build phase started"
      - ls -lh

  build:
    commands:
      - echo "Build phase started"
      # Install dependencies if file exists
      - if [ -f requirements.txt ]; then pip install -r requirements.txt -t .; else echo "No requirements.txt"; fi
      - echo "Creating deployment package..."
      # IMPORTANT: Zip must match CodePipeline Lambda deploy requirement
      - zip -r lambda_function.zip lambda_function.py
      - echo "Zip creation completed"

  post_build:
    commands:
      - echo "Post-build phase - validating output"
      - ls -lh lambda_function.zip

artifacts:
  files:
    - lambda_function.zip
