version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.9
    commands:
      - echo "Installing dependencies..."
      - pip install --upgrade pip
  
  pre_build:
    commands:
      - echo "Pre-build phase started"
      - echo "Checking for lambda_function.py..."
      - test -f lambda_function.py || (echo "ERROR: lambda_function.py not found" && exit 1)
  
  build:
    commands:
      - echo "Build phase started"
      - echo "Installing requirements if they exist..."
      - test -f requirements.txt && pip install -r requirements.txt -t . || echo "No requirements.txt"
      - echo "Creating deployment package..."
      - zip -r lambda-deployment-package.zip lambda_function.py
      - echo "Build phase completed"
  
  post_build:
    commands:
      - echo "Post-build phase - package ready"
      - ls -lh lambda-deployment-package.zip

artifacts:
  files:
    - lambda-deployment-package.zip
  discard-paths: no

cache:
  paths:
    - '/root/.cache/pip/**/*'
